    CompanySummaryResponse:
      type: object
      description: |
        Identity, valuation and the next scheduled report: the three raw vendor
        payloads a compact panel renders, and nothing below them.

        It is a **separate shape**, not `CompanyResponse` with the heavy fields
        nulled. On that schema a null payload means "asked, and the vendor has
        nothing"; a null here for a payload the endpoint never fetches would be
        the same wire value for the opposite fact. Absent fields cannot be
        misread that way: a consumer that wants filings has to call
        `getCompany`, which fetches them.

        Measured on NVDA, the statements, insider decisions, filings and
        headlines this omits are 98% of the full response.
      required:
      - ticker
      - covered
      - snapshotDate
      - fetchedAt
      properties:
        ticker:
          type: string
          example: NVDA
        companyName:
          type: string
          nullable: true
          example: NVIDIA Corporation
        covered:
          type: boolean
          description: '`false` means asked and answered: outside the plan, unlisted, or a name mismatch.
            All payloads are null.'
        snapshotDate:
          type: string
          format: date
        fetchedAt:
          type: string
          format: date-time
        profile:
          type: object
          nullable: true
          additionalProperties: true
          description: Raw `stock/profile2`. Exchange, industry, IPO date, country, market cap.
        metrics:
          type: object
          nullable: true
          additionalProperties: true
          description: 'Raw `stock/metric` under its own `metric` key: P/E, EPS TTM, dividend yield, 52-week
            range. Never the `series` archive.'
        calendar:
          type: object
          nullable: true
          additionalProperties: true
          description: Raw `calendar/earnings`. The next scheduled report.
    TokenomicsResponse:
      type: object
      description: |
        Supply, valuation and prose for one coin, plus how the requested market
        relates to it.

        The stored vendor payloads are kept whole and served narrow: this is the
        subset a consumer reads, not the interesting half of the body. A field
        absent here is one nothing asks for yet, not one the vendor withheld.
      required:
      - symbol
      - coingeckoId
      - relation
      properties:
        symbol:
          type: string
          description: The requested market symbol, echoed so a cached body is self-describing.
          example: BTC
        coingeckoId:
          type: string
          example: bitcoin
        relation:
          type: string
          enum:
          - asset
          - underlying
          description: '`asset`: a spot pair, so these figures describe what the market trades. `underlying`:
            a perpetual, so they describe what it tracks.'
          example: underlying
        name:
          type: string
          description: 'The coin''s own name, which is not our ticker: the market is `TON` and the asset
            is "Gram (prev. Toncoin)".'
          example: Bitcoin
        marketCap:
          type: number
          example: 1552188928000
        fullyDilutedValuation:
          type: number
          example: 1552199518846
        marketCapRank:
          type: integer
          example: 1
        circulatingSupply:
          type: number
          example: 20078650
        maxSupply:
          type: number
          description: 'Absent where the protocol sets no cap: a fact about the token, not a gap. Render
            the absence rather than a zero.'
          example: 21000000
        ath:
          type: number
          description: All-time high in USD.
          example: 126080
        description:
          type: string
        homepage:
          type: string
          format: uri
          example: https://bitcoin.org
        twitter:
          type: string
          format: uri
          description: Served as a URL, not the bare handle the vendor stores.
          example: https://x.com/bitcoin
        whitepaper:
          type: string
          format: uri
        marketFetchedAt:
          type: string
          format: date-time
          description: 'When the valuation figures were last refreshed: hourly in steady state, and the
            only staleness signal in this response.'
