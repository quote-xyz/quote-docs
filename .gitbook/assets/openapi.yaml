    QuestStatus:
      type: object
      required:
      - id
      - progress
      - target
      properties:
        id:
          type: string
          description: 'Quest identifier from the closed catalog: `fund_account`, `first_trade`, `connect_x`,
            `join_telegram`, `first_algo_order`, `quentin_trades`, `tpsl_set`, `conditional_order`, `all_strategies`,
            `algo_position_exit`, `trigger_variety`, `algo_speedup`, `trade_spot`, `trade_builder_dex`,
            `trade_prediction`, `market_variety`, `saved_vs_market`, `maker_fill`, `funding_collected`,
            `trade_days`, `api_key_minted`, `mcp_connected`, `cli_order`, `invite_friends`, `submit_quote`,
            `claim_rewards`. Read the ids rather than hard-coding a list: quests are added and retired
            as the product changes.'
        progress:
          type: number
          format: double
          description: Progress toward `target`, capped at `target`.
        target:
          type: number
          format: double
        tier:
          type: integer
          description: Catalog tier. An internal grouping key retained for analytics; not a user-facing
            progression axis (badges are). Unrelated to the volume-based loyalty tiers on `/api/referrals/summary`.
        completedAt:
          type: string
          format: date-time
          description: Present once the quest is complete (sticky).
    BadgeStatus:
      type: object
      required:
      - key
      - quests
      - earned
      - completed
      - total
      - isNew
      properties:
        key:
          type: string
          enum:
          - setup
          - operator
          - strategist
          - cartographer
          - editor
          - typesetter
          - advocate
          description: Stable badge identifier. Badges partition the quest catalog into thematic sets,
            independently of `QuestStatus.tier`.
        quests:
          type: array
          description: Member quest ids, in display order.
          items:
            type: string
        earned:
          type: boolean
          description: True once every member quest is complete.
        earnedAt:
          type: string
          format: date-time
          description: 'Present once earned: the completion time of the last member quest, not the time
            the award was first observed.'
        completed:
          type: integer
        total:
          type: integer
        isNew:
          type: boolean
          description: Earned but not yet acknowledged via `POST /api/quests/badges/{key}/seen`. Fire
            an unlock celebration on this flag, then acknowledge so it does not replay.
    RoutingSavingsResponse:
      type: object
      required:
      - sinceDays
      - decisions
      - venues
      - caveat
      properties:
        sinceDays:
          type: integer
          description: The look-back window actually applied, after clamping.
        decisions:
          type: integer
          format: int64
          description: How many routing verdicts the window holds for this wallet. Zero is an ordinary
            answer (routing may be off, or the wallet may not have traded) and is not the same as a zero
            saving.
        venues:
          type: array
          description: One entry per venue, best saving first.
          items:
            $ref: '#/components/schemas/RoutingVenueSaving'
        caveat:
          type: string
          description: What these numbers are and are not. Displayed liquidity at a haircut, with no queue,
            latency, impact or adverse selection.
    RoutingVenueSaving:
      type: object
      required:
      - venue
      - pricedClips
      - winningClips
      - winningNotionalUsd
      - savingUsd
      - feeSavingUsd
      - executionSavingUsd
      - premiumCostUsd
      - feeSources
      - refusals
      properties:
        venue:
          type: string
          example: binance
        pricedClips:
          type: integer
          format: int64
          description: Clips where this venue could be priced at all.
        winningClips:
          type: integer
          format: int64
          description: Clips where it would have beaten the venue the order actually went to, after any
            fragmentation premium.
        winningNotionalUsd:
          type: number
          format: double
          description: Notional across those winning clips.
        savingUsd:
          type: number
          format: double
          description: Total saving across the winning clips. `feeSavingUsd` + `executionSavingUsd`, less
            `premiumCostUsd`.
        feeSavingUsd:
          type: number
          format: double
          description: 'The fee half: what a venue connection captures on its own. Negative when this
            venue charges more and won on execution anyway.'
        executionSavingUsd:
          type: number
          format: double
          description: The book half. What crossing this venue's depth saved.
        premiumCostUsd:
          type: number
          format: double
          description: Charged against opening a position leg on a venue that would not otherwise hold
            one, for as long as both legs live.
        feeSources:
          type: array
          description: Where the fee numbers came from, and how often. `published` is the public base
            tier, nobody's actual rate, so a saving resting on it is a weaker claim than one resting on
            `house` or `user`.
          items:
            type: object
            required:
            - source
            - count
            properties:
              source:
                type: string
                enum:
                - user
                - house
                - published
              count:
                type: integer
                format: int64
        refusals:
          type: array
          description: Which gate stopped this venue, and how often. Present even when the venue was never
            priceable, which is the most informative case.
          items:
            type: object
            required:
            - reason
            - count
            properties:
              reason:
                type: string
                example: bookAbsent
              count:
                type: integer
                format: int64
    RoutingVenuePref:
      type: object
      required:
      - venue
      - enabled
      - baseline
      properties:
        venue:
          type: string
          example: binance
        enabled:
          type: boolean
          description: Whether routing may consider this venue. Default true.
        baseline:
          type: boolean
          description: Where orders go when routing changes nothing. Exactly one venue carries this, it
            is always enabled, and it cannot be turned off.
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: When the caller last set this preference. Null for a venue they have never touched,
            which distinguishes the default from a deliberate re-enable.
    QuestsResponse:
      type: object
      required:
      - success
      - quests
      - badges
      - next
      properties:
        success:
          type: boolean
        quests:
          type: array
          description: Every quest in the catalog, in display order.
          items:
            $ref: '#/components/schemas/QuestStatus'
        badges:
          type: array
          description: Every badge, in display order.
          items:
            $ref: '#/components/schemas/BadgeStatus'
        next:
          type: array
          description: 'Incomplete quest ids ranked best-first: nearest to completion, then belonging
            to the nearest-complete badge, then catalog order. Quests the wallet cannot currently act
            on are omitted. Deterministic, so the head is safe to render as a persistent "next up" prompt.'
          items:
            type: string
    SubmitQuoteRequest:
      type: object
      required:
      - quoteText
      properties:
        quoteText:
          type: string
          maxLength: 280
        author:
          type: string
          nullable: true
          maxLength: 80
    ExecutionMetrics:
