          type: boolean
        order:
          $ref: '#/components/schemas/AlgoOrderInfo'
    OrderByClientIdResponse:
      type: object
      required:
      - success
      - clientOrderId
      - found
      properties:
        success:
          type: boolean
        clientOrderId:
          type: string
          description: The id that was looked up, echoed back.
        found:
          type: boolean
          description: Whether any source can account for this id. `false` means nothing was placed under
            it and re-sending is safe.
        orderId:
          type: string
          description: Venue order id, from Quote's registry or from Hyperliquid.
        symbol:
          type: string
        side:
          type: string
          enum:
          - buy
          - sell
        submittedAt:
          type: string
          format: date-time
          description: 'When Quote registered the order. Absent when only Hyperliquid knows it, which
            is itself informative: the order landed and our reply to you was lost.'
        algoOrderId:
          type: string
          description: Present when this id belongs to an algo run. Follow it to `GET /api/orders/algo/{order_id}`
            for schedule and slice detail.
        venueStatus:
          type: string
          description: 'Hyperliquid''s lifecycle status for the order: `open`, `filled`, `canceled`, `rejected`,
            or `unknownOid` when Hyperliquid has no such order. Absent when Hyperliquid could not be reached,
            which is not the same as `unknownOid`.'
        filledSize:
          type: string
          description: Base-asset quantity filled. Absent when unknown; never `"0"` to mean unknown.
        avgPrice:
          type: string
          description: Volume-weighted fill price. Only present alongside a ledger-derived `filledSize`,
            since Hyperliquid reports a size without an average.
