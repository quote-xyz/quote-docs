components:
  securitySchemes:
    ApiKeyHmac:
      type: apiKey
      in: header
      name: X-Quote-Key
      description: |
        HMAC API-key authentication. Three headers are sent on every request:

        - `X-Quote-Key`: the public key id (this scheme's header).
        - `X-Quote-Timestamp`: request time in **milliseconds** since epoch.
          Must be within 30 seconds of server time.
        - `X-Quote-Signature`: hex HMAC-SHA256 over the canonical string.

        **Canonical signing string** (literal `\n` separators):

        ```
        <timestamp>\n<METHOD>\n<path_with_query>\n<body>
        ```

        where `<timestamp>` is the `X-Quote-Timestamp` value, `<METHOD>` is the
        uppercase HTTP method, `<path_with_query>` is the request path including
        any query string, and `<body>` is the raw request body (empty string if
        none). The 32-byte secret returned at mint time is used **directly** as
        the HMAC-SHA256 key.

        Keys are minted, listed, and revoked in the Quote terminal
        (**Settings → API Keys**). A key carries only the scopes granted at mint
        time.
  parameters:
    TemplateId:
      name: template_id
      in: path
      required: true
      description: Template UUID.
      schema:
        type: string
        format: uuid
    TriggerId:
      name: trigger_id
      in: path
      required: true
      description: Trigger UUID.
      schema:
        type: string
        format: uuid
    AnalyticsRange:
      name: range
      in: query
      required: false
      description: 'Time range. One of: 1d, 7d, 30d, all. Defaults to a server default when omitted.'
      schema:
        type: string
        enum:
        - 1d
        - 7d
        - 30d
        - all
  responses:
    BadRequest:
      description: Invalid request (validation error, malformed body/UUID, etc.).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 'Authenticated but not permitted: the API key lacks the required scope.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found or not owned by the caller's wallet.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: |
        Rate limit exceeded. Carries `Retry-After`: the limiter's own wait for
        the caller's bucket, so a client can back off for exactly as long as it
        needs to rather than guessing.
      headers:
        Retry-After:
          description: Whole seconds to wait before retrying. Always at least 1.
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadGateway:
      description: Upstream (Hyperliquid/Relay) returned an error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: |
        A required dependency is unavailable or a feature is not configured
        (also returned when a Hyperliquid circuit breaker is open).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: |
        Request body exceeds the 4 MiB limit enforced by the body-buffering
        layer. The response body is not the standard JSON error envelope.
  schemas:
    ErrorResponse:
      type: object
      description: Standard error envelope used for 4xx/5xx (except 413/204).
      required:
      - success
      - error
      - code
      properties:
        success:
          type: boolean
          enum:
          - false
        error:
          type: string
        code:
          type: string
          description: |
            Stable machine-readable error code. Always present: branch on this
            rather than on the `error` text or the status code, both of which are
            free to change.

            Generic codes mirror the status: `BAD_REQUEST`, `UNAUTHORIZED`,
            `FORBIDDEN`, `NOT_FOUND`, `RATE_LIMITED`, `SERVICE_UNAVAILABLE`,
            `BAD_GATEWAY`, `INTERNAL`.

            Specific codes carry more: `HL_NOT_FUNDED` (422 from
            `POST /api/agents/register`), `builder_fee_not_approved` (403,
            lowercase for historical reasons, carrying the fields needed to sign
            `ApproveBuilderFee`), and the order-submission codes below.

            A **plain** order submission (`POST /api/orders` without `strategy`)
            additionally returns `disposition`, which says whether the order may
            have reached Hyperliquid. Retry logic should read that field, not the
            status. An algo submission makes no venue call at submit time (it
            records an intent the engine then executes in slices), so a failed
            algo submit has no venue outcome to be ambiguous about and returns a
            generic code instead:

            | code | status | disposition | what to do |
            |------|--------|-------------|------------|
            | `EXECUTION_UNAVAILABLE` | 503 | `not_sent` | Re-send as-is. |
            | `RATE_LIMITED` | 429 | `not_sent` | Pause, then re-send as-is. |
            | `VENUE_UNREACHABLE` | 502 | `unknown` | Do **not** blindly re-send. Resolve the `clientOrderId` on the body via `GET /api/orders/by-client-id/{client_order_id}` first. |
            | `ORDER_REJECTED` | 400 | `refused` | Fix the order. Nothing was placed. |
            | `INVALID_ORDER` | 400 | `refused` | Fix the request. Nothing was placed. |
            | `AGENT_UNUSABLE` | 422 | `refused` | Never retry: re-onboard the agent wallet. |

            `unknown` is the only disposition under which the order may be live.
        disposition:
          type: string
          enum:
          - not_sent
          - unknown
          - refused
          description: Whether the order reached Hyperliquid, which an HTTP status cannot express. Present
            on plain-order submission errors only. See the table under `code`.
        clientOrderId:
          type: string
          description: The id the failed attempt was submitted under, present alongside `disposition`,
            including when you supplied no id of your own, since one is assigned server-side.
    SuccessResponse:
      type: object
      required:
      - success
      properties:
        success:
          type: boolean
          enum:
          - true
    MessageResponse:
      type: object
      description: Generic success response with an optional human-readable message.
      required:
      - success
      properties:
        success:
          type: boolean
        message:
          type: string
        error:
          type: string
    Side:
      type: string
      enum:
      - buy
      - sell
    OrderType:
      type: string
      enum:
      - limit
      - market
    TimeInForce:
      type: string
      description: Time in force. Serialized as the uppercase variant names.
      enum:
      - GTC
      - ALO
      - IOC
    TpslMode:
      type: string
      enum:
      - market
      - limit
    TpslSide:
      type: object
      required:
      - triggerPrice
      properties:
        triggerPrice:
          type: string
        limitPrice:
          type: string
          nullable: true
    TpslParams:
      type: object
      description: TP/SL configuration. Note `mode`, `tp`, `sl` are snake/lower as named.
      required:
      - mode
      properties:
        mode:
          $ref: '#/components/schemas/TpslMode'
        tp:
          allOf:
          - $ref: '#/components/schemas/TpslSide'
          nullable: true
        sl:
          allOf:
          - $ref: '#/components/schemas/TpslSide'
          nullable: true
    StrategyParamsInput:
      type: object
      description: |
        Strategy-specific parameters forwarded to the execution engine. This is
        a large, mostly-optional bag of knobs; the relevant subset depends on
        the chosen `strategy`. Fields accept both camelCase and snake_case keys
        (serde aliases). Numeric "bps"/decimal fields accept string, integer, or
        float JSON. Only commonly-used fields are enumerated here; additional
        properties are accepted.
      additionalProperties: true
      properties:
        reduceOnly:
          type: boolean
          nullable: true
        timeInForce:
          type: string
          nullable: true
          description: Child-order TIF (gtc/alo/ioc), strategy-dependent.
        attachedTpsl:
          allOf:
          - $ref: '#/components/schemas/TpslParams'
          nullable: true
        durationSecs:
          type: integer
          format: int64
          nullable: true
        numSlices:
          type: integer
          format: int64
          nullable: true
        passivePct:
          type: integer
          format: int64
          nullable: true
        clipSize:
          type: string
          nullable: true
          description: Decimal as string.
        clipPct:
          type: number
          format: double
          nullable: true
        participationRate:
          type: string
          nullable: true
          description: Decimal as string.
        urgency:
          type: integer
          format: int64
          nullable: true
          description: 0–100.
        randomize:
          type: boolean
          nullable: true
        maxSlippageBps:
          type: string
          nullable: true
          description: 'Price bound in basis points from the arrival mid, beyond which the order will
            not execute. On `participation_rate` it bounds every child order including the `maxDurationSecs`
            completion sweep, and taker clips that would breach it are skipped rather than sent; the order
            may finish unfilled. Other strategies ignore it: use `limitPrice` there. Must be greater than
            0.'
        hardCancelPct:
          type: string
          nullable: true
        offsetFromMidBps:
          type: integer
          format: int64
          nullable: true
        chaseEnabled:
          type: boolean
          nullable: true
        cross:
          type: boolean
          nullable: true
          default: false
          description: '`chase_limit` only. Work the taker side of the book: price at the opposing touch
            and re-peg there as it moves, instead of resting inside the spread. What does not fill immediately
            rests at that price, so it keeps working between re-pegs. `limitPrice` still bounds it, and
            a limit that does not reach the market simply rests there. The offset ladder does not apply.
            Default false, since crossing pays the spread on every fill.'
        guaranteedCompletion:
          type: boolean
          nullable: true
    SubmitOrderRequest:
      type: object
      required:
      - symbol
      - side
      - size
      - orderType
      properties:
        symbol:
          type: string
          example: ETH
        side:
          $ref: '#/components/schemas/Side'
        size:
          type: string
          description: Base-asset size as a decimal string.
        orderType:
          $ref: '#/components/schemas/OrderType'
        limitPrice:
          type: string
          nullable: true
          description: Required for limit orders; for market orders supply a slippage-adjusted price.
        reduceOnly:
          type: boolean
          nullable: true
          default: false
        timeInForce:
          allOf:
          - $ref: '#/components/schemas/TimeInForce'
          nullable: true
        clientOrderId:
          type: string
          nullable: true
          description: 'Your own id for this order, and the idempotency key for re-sending it. Supply
            and reuse one whenever a retry must not place a second order: a duplicate is refused rather
            than executed, so a submit that timed out can be safely re-sent under the same id. Algo orders
            are deduplicated by this API and return the existing order with a warning; plain orders are
            deduplicated by Hyperliquid, which rejects the duplicate. Omit it and an id is assigned server-side
            and returned to you. That is enough to resolve the order afterwards, but not enough to make
            your retry idempotent, since each retry would be assigned a new one. Echoed back on the response
            and resolvable via `GET /api/orders/by-client-id/{client_order_id}`.'
        strategy:
          type: string
          nullable: true
          description: Algo strategy name (e.g. passive_twap, vwap, iceberg, participation_rate, chase_limit).
            Omit for a plain order.
        params:
          allOf:
          - $ref: '#/components/schemas/StrategyParamsInput'
          nullable: true
        tpsl:
          allOf:
          - $ref: '#/components/schemas/TpslParams'
          nullable: true
        source:
          type: string
          nullable: true
          description: Originating product surface, when not the plain order form (e.g. `quentin` for
            orders dispatched by the NL assistant). Attribution only, never affects execution.
        postId:
          type: string
          nullable: true
          maxLength: 512
          description: The wire post this order was placed off, when it was placed from a breaking-news
            headline. Attribution only, never affects execution, and what lets news execution be measured
            against the post that triggered it. Empty or longer than 512 characters is rejected with a
            400 rather than recorded.
    SubmitOrderResponse:
      type: object
      required:
      - success
      properties:
        success:
          type: boolean
        orderId:
          type: string
          description: Venue order id, or for algo strategies the parent strategy id.
        status:
          type: string
        provider:
          type: string
          description: Execution provider, e.g. "hyperliquid".
        clientOrderId:
          type: string
          description: 'The client order id this order was submitted under: yours when you sent one, otherwise
            the id assigned server-side. Always present on a successful submit, and it is the key `GET
            /api/orders/by-client-id/{client_order_id}` resolves, so record it if you may need to ask
            later whether the order landed.'
        error:
          type: string
        warnings:
          type: array
          items:
            type: string
    CancelOrderRequest:
      type: object
      required:
      - symbol
      - orderId
      properties:
        symbol:
          type: string
        orderId:
          type: string
    CancelOrderResponse:
      type: object
      required:
      - success
      properties:
        success:
          type: boolean
        message:
          type: string
        error:
          type: string
    CancelAllOrdersRequest:
      type: object
      properties:
        symbol:
          type: string
          nullable: true
          description: If omitted, cancels all open orders.
    CancelOrderItem:
      type: object
      required:
      - symbol
      - orderId
      properties:
        symbol:
          type: string
        orderId:
          type: string
          description: Numeric exchange order id (oid). A strategy client order id is refused with status
            `failed`.
    CancelOrdersBatchRequest:
      type: object
      required:
      - orders
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/CancelOrderItem'
    CancelOrderResult:
      type: object
      required:
      - symbol
      - orderId
      - status
      properties:
        symbol:
          type: string
        orderId:
          type: string
        status:
          type: string
          enum:
          - cancelled
          - alreadyClosed
          - failed
          description: |
            `cancelled` - this call closed the order.
            `alreadyClosed` - it was already not open when the cancel arrived.
            `failed` - the venue refused it, or it never reached the venue.
        error:
          type: string
          description: Present only when `status` is `failed`.
        orderStatus:
          type: string
          description: The venue's own lifecycle word when `status` is `alreadyClosed` (e.g. "filled",
            "canceled"). This is the only thing separating an order that filled from one that was already
            cancelled. Absent otherwise.
    CancelOrdersBatchResponse:
      type: object
      required:
      - allClosed
      - cancelled
      - alreadyClosed
      - failed
      - results
      properties:
        allClosed:
          type: boolean
          description: True when nothing failed, i.e. no requested order is still open.
        cancelled:
          type: integer
          description: Orders this call closed. Excludes orders already closed on arrival.
        alreadyClosed:
          type: integer
          description: Orders already gone before the cancel arrived.
        failed:
          type: integer
          description: Orders the venue refused to cancel.
        results:
          type: array
          description: One entry per requested order. The three counts above partition this list exactly.
          items:
            $ref: '#/components/schemas/CancelOrderResult'
    SetAccountModeRequest:
      type: object
      required:
      - mode
      properties:
        mode:
          type: string
          enum:
          - standard
          - unifiedAccount
          - portfolioMargin
    SetAccountModeResponse:
      type: object
      required:
      - success
      properties:
        success:
          type: boolean
        message:
          type: string
        error:
          type: string
    SimulateOrderRequest:
      type: object
      required:
      - symbol
      - side
      - size
      properties:
        symbol:
          type: string
        side:
          $ref: '#/components/schemas/Side'
        size:
          type: string
          description: Decimal string, in base units.
    SimulateOrderResponse:
      type: object
      required:
      - hasEstimate
      properties:
        hasEstimate:
          type: boolean
          description: False when the book cannot price the order at all. The remaining fields are then
            absent.
        expectedPrice:
          type: string
          description: Average fill price across the simulated sweep.
        vwap:
          type: string
          description: Volume-weighted price of the levels consumed.
        impactBps:
          type: string
          description: Signed depth cost against the best opposing quote. Positive is worse, matching
            the benchmark convention used across the API.
        bestPrice:
          type: string
          description: Best opposing quote at simulation time.
        mid:
          type: string
        availableSize:
          type: string
          description: Total same-side depth, so a caller can tell a partial fill.
        error:
          type: string
          description: Present only when `hasEstimate` is false.
    UrgencyPreviewResponse:
      type: object
      description: Field names are snake_case here, unlike the rest of the API. Every field is absent
        when it does not apply to the requested strategy.
      properties:
        intervals:
          type: integer
          format: int32
        passive_pct:
          type: integer
          format: int32
        participation_pct:
          type: integer
          format: int32
        expected_maker_pct:
          type: integer
          format: int32
    SpeedUpOrderRequest:
      type: object
      properties:
        factor:
          type: number
          format: double
          nullable: true
          description: Compression factor for the remaining schedule.
    SpeedUpOrderResponse:
      type: object
      required:
      - success
      properties:
        success:
          type: boolean
        message:
          type: string
        error:
          type: string
        factor:
          type: number
          format: double
          description: The factor actually applied.
        newDurationSecs:
          type: integer
          format: int64
        newParticipationRate:
          type: string
    AlgoFillInfo:
      type: object
      required:
      - symbol
      - side
      - size
      - price
      - timestamp
      properties:
        symbol:
          type: string
        side:
          type: string
        size:
          type: string
        price:
          type: string
        fee:
          type: string
        builderFee:
          type: string
        isMaker:
          type: boolean
        timestamp:
          type: integer
          format: int64
          description: 'When the fill happened, epoch milliseconds: Hyperliquid''s own clock where the
            ledger has it, else Quote''s write clock. The two match for a fill delivered live and diverge
            for one the reconciler recovered, whose write time is minutes after the trade, so this is
            the instant to join against live fill events on.'
    AlgoOrderFillsResponse:
      type: object
      required:
      - success
      - fills
      properties:
        success:
          type: boolean
        fills:
          type: array
          items:
            $ref: '#/components/schemas/AlgoFillInfo'
    AlgoDiagnosticInfo:
      type: object
      required:
      - recordedAtMs
      - details
      properties:
        recordedAtMs:
          type: integer
          format: int64
          description: When the diagnostic was recorded, epoch milliseconds.
        details:
          type: object
          additionalProperties: true
          description: 'The redacted diagnostic payload, keyed by `event`: the same projection the live
            socket''s `wake` frames carry.'
    AlgoDiagnosticsResponse:
      type: object
      required:
      - success
      - diagnostics
      properties:
        success:
          type: boolean
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/AlgoDiagnosticInfo'
    SetPositionTpslRequest:
      type: object
      required:
      - symbol
      - tpsl
      properties:
        symbol:
          type: string
        tpsl:
          $ref: '#/components/schemas/TpslParams'
        size:
          type: string
          nullable: true
          description: Defaults to the whole position.
        replaceOids:
          type: array
          nullable: true
          items:
            type: integer
            format: int64
          description: 'Fixed-size triggers on this symbol to cancel as part of the replacement: the reduce-only
            legs that order-attached TP/SL and partial closes leave behind, which nothing at the venue
            ties to the position. Position-bound triggers are always replaced and never need naming here.
            Each oid must be a closing trigger order on this symbol; any other oid is rejected, so an
            unrelated resting order can never be cancelled through this field.'
    SetPositionTpslResponse:
      type: object
      required:
      - success
      - replaced
      properties:
        success:
          type: boolean
        tpOrderId:
          type: string
        slOrderId:
          type: string
        replaced:
          type: integer
          description: 'Trigger orders cancelled as part of the replacement: every position-bound leg,
            plus whichever were named in `replaceOids`.'
        warnings:
          type: array
          items:
            type: string
        error:
          type: string
    TacticSummary:
      type: object
      required:
      - parentOrderId
      - strategy
      - filled
      properties:
        parentOrderId:
          type: string
          format: uuid
          nullable: true
        strategy:
          type: string
          nullable: true
        filled:
          type: string
        execVwap:
          type: string
        vsTacticArrivalBps:
          type: string
          description: Measured from this tactic's own arrival, not the intent's.
        vsMarketOrderBps:
          type: string
        makerFillPct:
          type: string
    IntentExecutionReport:
      type: object
      required:
      - intentId
      - symbol
      - side
      - objective
      - totalSize
      - filledSize
      - residual
      - tacticCount
      - totalFees
      - builderFees
      - elapsedSecs
      - tactics
      properties:
        intentId:
          type: string
          format: uuid
        symbol:
          type: string
        side:
          $ref: '#/components/schemas/Side'
        objective:
          type: string
          enum:
          - arrival
          - vwap
          - close
          - none
        totalSize:
          type: string
        filledSize:
          type: string
        residual:
          type: string
          description: Size neither filled nor in flight.
        tacticCount:
          type: integer
        execVwap:
          type: string
          description: 'Size-weighted execution price across every tactic, fee-adjusted: Hyperliquid''s
            per-fill fee (builder fee included) folded into the price, the basis `executionBps` is measured
            on. Each tactic''s own `execVwap` stays the stored raw price.'
        arrivalMid:
          type: string
          description: Mid at intent creation. Never back-filled. The raw mid; `totalShortfallBps` loads
            it with the taker fee first.
        totalShortfallBps:
          type: string
          description: 'Measured from the intent''s arrival anchor loaded with the taker fee, against
            the fee-adjusted `execVwap`: the same bases as `executionBps`, so fees sit inside both and
            never inside `delayBps`.'
        executionBps:
          type: string
          description: Measured from each tactic's own arrival.
        delayBps:
          type: string
          description: 'Total minus execution: the drift between committing to the trade and a tactic
            starting. Reported separately so waiting cannot read as good execution.'
        vsMarketOrderBps:
          type: string
        vsHlNativeTwapBps:
          type: string
          description: Estimated against a taker-only native TWAP, crediting the taker fee our maker share
            avoided.
        makerFillPct:
          type: string
        totalFees:
          type: string
        builderFees:
          type: string
        elapsedSecs:
          type: integer
          format: int64
        tactics:
          type: array
          items:
            $ref: '#/components/schemas/TacticSummary'
    BookDepth:
      type: object
      description: |
        One market's own book, summed inside `windowPct` either side of its mid.
        Both sides are reported and never only the total: a book carrying $32k
        of bids against $16k of asks will take a sale and not a purchase, and
        one averaged number says the opposite of what that trader needs.
      required:
      - symbol
      - mid
      - spreadBps
      - windowPct
      - bidUsd
      - askUsd
      - totalUsd
      - reachPct
      - coversWindow
      - asOf
      properties:
        symbol:
          type: string
          example: BTC
        mid:
          type: number
          format: double
        spreadBps:
          type: number
          format: double
          description: Top of book
          from this book's own touch.: null
        windowPct:
          type: number
          format: double
          example: 1
          description: Half-width of the window. On the wire because the totals mean nothing without it.
        bidUsd:
          type: number
          format: double
        askUsd:
          type: number
          format: double
        totalUsd:
          type: number
          format: double
        reachPct:
          type: number
          format: double
          description: How far the book reached from the mid, on the shorter side.
        coversWindow:
          type: boolean
          description: '`false` means every total here is a FLOOR rather than the answer: the book ran
            out before the window did, so rendering them as the answer reports a thin market where what
            happened was a short read. Hyperliquid''s default price grid reaches about 10 bps, so a 1%
            window needs the coarse grid stitched under it and how far that reaches depends on the market.'
        asOf:
          type: integer
          format: int64
          description: ms since epoch.
    LiquidityReading:
      type: object
      required:
      - status
      description: One market's reading. Every field but `status` is omitted rather than nulled when absent,
        so a missing value cannot be read as zero.
      properties:
        status:
          type: string
          enum:
          - ready
          - flat
          - warming
          - no_market
          description: Whether a seasonal `score` is available, and why not when it is not. `no_market`
            means Hyperliquid is not quoting this market, never that our own copy of it went stale.
        level:
          type: number
          description: Cross-sectional, 1-10, 10 = most liquid on the venue. The number to sort and display.
            Present whenever the market is priced.
        score:
          type: integer
          description: 'Self-relative, 1-10: tighter or wider than this market usually is at this hour
            of day. Context, never a ranking. Only when `ready`.'
        percentile:
          type: number
          description: Fraction of the same-hour baseline wider than now.
        spreadBps:
          type: number
          description: Impact spread. The round trip on a fixed-notional sweep.
        medianBps:
          type: number
          description: What "usual" was over the window.
        grade:
          type: string
          description: Absolute rung, `a`-`e`, tightest first.
        rank:
          type: integer
          description: Position among priced markets, tightest = 1. Read with `universe`.
        samples:
          type: integer
        requiredSamples:
          type: integer
        asOf:
          type: string
          format: date-time
          description: 'When this reading was observed. Present whenever a reading is. Measure age against
            the manifest''s `generatedAt`, never against your own clock: the response is edge-cached,
            so the difference between the two timestamps is the only exact one.'
    ModifyOrderRequest:
      type: object
      required:
      - symbol
      - orderId
      - side
      - limitPrice
      - size
      properties:
        symbol:
          type: string
        orderId:
          type: integer
          format: int64
          description: Exchange order id to modify.
        side:
          type: string
          enum:
          - buy
          - sell
        limitPrice:
          type: string
        size:
          type: string
        reduceOnly:
          type: boolean
          default: false
        timeInForce:
          type: string
          enum:
          - gtc
          - alo
          - ioc
          nullable: true
          description: Defaults to gtc.
        clientOrderId:
          type: string
          nullable: true
    ModifyOrderResponse:
      type: object
      required:
      - success
      properties:
        success:
          type: boolean
        message:
          type: string
        error:
          type: string
    AlgoOrderInfo:
      type: object
      required:
      - orderId
      - symbol
      - side
      - orderQty
      - filledQty
      - status
      - strategy
      - submitTime
      - alreadySpedUp
      properties:
        orderId:
          type: string
        symbol:
          type: string
        side:
          type: string
          description: Debug-formatted side (e.g. "Buy"/"Sell").
        orderQty:
          type: string
        filledQty:
          type: string
        status:
          type: string
        strategy:
          type: string
        submitTime:
          type: string
          format: date-time
        finishedTime:
          type: string
          format: date-time
          description: When the order reached a terminal state (completed, cancelled or failed). Absent
            while it is still active.
        error:
          type: string
          description: Why the order failed. Present only for failed orders.
        alreadySpedUp:
          type: boolean
          description: Whether this order has used its one in-flight speed-up. Speeding up an order for
            which this is `true` is rejected with `400`.
        benchmark:
          allOf:
          - $ref: '#/components/schemas/AlgoBenchmark'
          description: Post-trade execution benchmark. On the detail (`GET /api/orders/algo/{order_id}`)
            only, and only once the order has a persisted analytics row; the list never carries it.
        limitPrice:
          type: string
          description: User-set limit price bound, when the order carries one.
        plannedDurationSecs:
          type: integer
          format: int64
          description: The `duration_secs` window of the time-sliced strategies (TWAP, adaptive IS, VWAP),
            in seconds. Absent for POV, chase and iceberg, whose only time knob is a ceiling (`maxDurationSecs`).
        maxDurationSecs:
          type: integer
          format: int64
          description: 'Hard time limit when the strategy has one (POV''s max duration, chase''s give-up
            bound, iceberg''s completion sweep), in seconds. A ceiling, never a plan: a schedule must
            not be drawn from it. Absent when the strategy has no ceiling, including iceberg''s sweep
            when it is disabled, which the strategy stores as 0.'
        numSlices:
          type: integer
          format: int64
          description: Planned slice count for time-sliced strategies.
        participationRate:
          type: string
          description: 'Target participation rate as a fraction (e.g. "0.1" = 10%): POV''s rate, or iceberg''s
            volume-adaptive clip rate. Absent when the strategy has none, including an iceberg on a fixed
            clip, which the strategy stores as 0.'
        clipSize:
          type: string
          description: Iceberg clip size, asset units.
        maxSlippageBps:
          type: string
          description: User-set slippage bound vs the arrival mid, bps.
        reduceOnly:
          type: boolean
        guaranteedCompletion:
          type: boolean
          description: 'Whether the user asked for guaranteed completion: TWAP''s `guaranteed_completion`,
            or the `must_complete` residual sweep of VWAP and chase.'
        volumeProfile:
          type: array
          items:
            type: number
          description: 'Planned per-slice volume weights (VWAP), one entry per slice, captured at submit:
            the schedule a progress view draws the planned trajectory from. Relative weights: only their
            ratios carry meaning, so normalise before drawing.'
        parentIntentId:
          type: string
          format: uuid
          description: The trade intent this run is a tactic of, when the order was placed through one.
            Follow it to `GET /api/trade-intents/{id}` for the cross-tactic report.
    AlgoBenchmark:
      type: object
      description: 'Execution-quality benchmarks for an algo order, persisted at terminal. Decimals as
        strings; signed bps follow the "positive = worse" convention: except the markout fields, which
        use the microstructure convention `/api/analytics/execution` uses (positive = the price moved
        in the order''s favor after its fills).'
      properties:
        vsArrivalBps:
          type: string
        vsArrivalUsd:
          type: string
        vsMarketBps:
          type: string
          description: 'Vs a simulated same-size market-order sweep of the book at each slice: the spread-capture
            benchmark.'
        vsMarketUsd:
          type: string
        vsVwapBps:
          type: string
        vsVwapUsd:
          type: string
        execVwap:
          type: string
        marketVwap:
          type: string
          description: The market's own VWAP over the execution window, the level `vsVwapBps` is measured
            against. Absent when the trades source fed nothing, and on runs recorded before it was stored.
        curve:
          type: array
          description: Running levels behind execVwap, the arrival anchor and marketVwap, one sample per
            fill and thinned to at most 180 points with the first and last kept exactly. Lets a chart
            draw the path instead of a flat line at each endpoint. Absent on runs that never filled.
          items:
            type: object
            required:
            - atMs
            - execVwap
            properties:
              atMs:
                type: integer
                format: int64
                description: When the fill was recorded, epoch milliseconds.
              execVwap:
                type: string
                description: 'Fee-adjusted running execution VWAP over the fills so far: the basis of
                  the summary `execVwap`, which the last sample equals.'
              arrivalVwap:
                type: string
                description: 'Size-weighted mid at each fill so far, loaded with the taker fee: the anchor
                  `vsArrivalBps` is measured against. Absent until a fill has carried a mid.'
              marketVwap:
                type: string
                description: The market's own VWAP as it stood at this fill. The last sample carries the
                  summary `marketVwap` instead (the market keeps printing after the last fill), so the
                  two are one number. Absent until the trades source has fed something.
        totalFees:
          type: string
          description: 'Hyperliquid''s fees on this order''s fills (USDC), builder fee included: the per-fill
            fee the venue charges carries it.'
        makerFillPct:
          type: string
        elapsedSecs:
          type: string
        builderFees:
          type: string
          description: 'The part of `totalFees` that went to the builder (USDC): a breakdown of it, not
            a charge beside it.'
        markout1sBps:
          type: string
        markout5sBps:
          type: string
        markout30sBps:
          type: string
        makerMarkout1sBps:
          type: string
          description: Maker-fill-only markout. The adverse-selection read on resting orders.
        makerMarkout5sBps:
          type: string
        makerMarkout30sBps:
          type: string
    AlgoOrdersResponse:
      type: object
      required:
      - success
      - orders
      properties:
        success:
          type: boolean
        orders:
          type: array
          items:
            $ref: '#/components/schemas/AlgoOrderInfo'
    AlgoOrderResponse:
