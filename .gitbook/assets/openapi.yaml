      required:
      - isBps
      - isSavingsDollars
      - volumeTraded
      - totalFills
      - fillsAtOrBetterPct
      - avgSlippageBps
      properties:
        isBps:
          type: number
          format: double
          description: Notional-weighted IS vs arrival (bps; positive = worse).
        isSavingsDollars:
          type: number
          format: double
          description: Dollars saved vs a naive market order (positive = saved).
        volumeTraded:
          type: number
          format: double
        totalFills:
          type: integer
          format: int64
        fillsAtOrBetterPct:
          type: number
          format: double
        avgSlippageBps:
          type: number
          format: double
    ExecutionTimelinePoint:
      type: object
      required:
      - timestamp
      - volumeTraded
      - hlTotalCost
      - quoteTotalCost
      - hlSlippage
      - quoteSlippage
      - hlFees
      - quoteFees
      properties:
        timestamp:
          type: integer
          format: int64
          description: Bucket start, epoch milliseconds.
        volumeTraded:
          type: number
          format: double
        hlTotalCost:
          type: number
          format: double
        quoteTotalCost:
          type: number
          format: double
        hlSlippage:
          type: number
          format: double
        quoteSlippage:
          type: number
          format: double
        hlFees:
          type: number
          format: double
          description: |
            Counterfactual fee: the notional swept at the measured taker rate.
        quoteFees:
          type: number
          format: double
          description: |
            Fees actually paid, from the ledger. Both sides carry the builder
            fee: the venue charges it inside its own per-fill fee, so it is in
            this sum and in the measured taker rate alike, and neither adds it
            on top.
    VolumeResponse:
      type: object
      required:
      - cumulativeVolume
      properties:
        cumulativeVolume:
          type: number
          format: double
    FeesResponse:
      type: object
      required:
      - totalFee
      - builderFee
      properties:
        totalFee:
          type: number
          format: double
          description: |
            What Quote-routed fills cost this wallet over the range (USDC), and
            the whole of it. Hyperliquid documents its per-fill `fee` as "the
            total fee, inclusive of builderFee", so `builderFee` is a breakdown
            of this figure and `makerFee + takerFee` is the same figure split by
            side: neither is ever added to it.
        exchangeFee:
          type: number
          format: double
          description: |
            Deprecated alias of `totalFee`, identical in value. It never was the
            exchange's share alone; kept only while existing clients read it.
          deprecated: true
        builderFee:
          type: number
          format: double
          description: The part of `totalFee` that went to Quote as the builder.
        takerFee:
          type: number
          format: double
          description: The part of `totalFee` charged on fills that crossed.
        makerFee:
          type: number
          format: double
          description: |
            The part of `totalFee` charged on fills that rested. With `takerFee`
            this sums to `totalFee`, short only by fills whose side the venue
            did not state.
        volume:
          type: number
          format: double
        takerBps:
          type: number
          format: double
          nullable: true
          description: |
            Realized rate: the fee actually charged over the notional it was
            charged on, not the account's fee-tier rate. Null when nothing
            traded on that side, which reads differently from a measured zero.
        makerBps:
          type: number
          format: double
          nullable: true
        builderBps:
          type: number
          format: double
          nullable: true
    FeeSummaryResponse:
      type: object
      required:
      - hyperliquid
      - quote
      - effective
      properties:
        hyperliquid:
          $ref: '#/components/schemas/HyperliquidFees'
        quote:
          $ref: '#/components/schemas/QuoteFees'
        rewards:
          allOf:
          - $ref: '#/components/schemas/RewardsFees'
          nullable: true
          description: Null when the loyalty program isn't configured.
        effective:
          $ref: '#/components/schemas/EffectiveFees'
    HyperliquidFees:
      type: object
      required:
