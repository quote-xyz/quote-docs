      - stakingDiscountPct
      - referralDiscountPct
      properties:
        takerBps:
          type: number
          format: double
          nullable: true
          description: Net perp taker rate, with tier, staking, and referral applied.
        makerBps:
          type: number
          format: double
          nullable: true
        spotTakerBps:
          type: number
          format: double
          nullable: true
        spotMakerBps:
          type: number
          format: double
          nullable: true
        volumeTier:
          type: integer
          nullable: true
          description: 'Volume-tier index (0 = base). Null means the rate didn''t match the published
            ladder: unknown, not tier 0.'
        volumeTierFloorUsd:
          type: number
          format: double
          nullable: true
        nextVolumeTierFloorUsd:
          type: number
          format: double
          nullable: true
          description: Null at the top tier.
        volume14dUsd:
          type: number
          format: double
          description: Own taker + maker volume over the last 14 daily rows. An approximation of the figure
            HL tiers on, which weights spot 2×; prefer `volumeTier`.
        stakingDiscountPct:
          type: number
          format: double
          description: HYPE-staking discount as a percent off HL fees (40.0 = 40% off).
        referralDiscountPct:
          type: number
          format: double
    QuoteFees:
      type: object
      required:
      - builderFeeBpsPerp
      - builderFeeBpsSpot
      - builderFeeCharged
      properties:
        builderFeeBpsPerp:
          type: number
          format: double
        builderFeeBpsSpot:
          type: number
          format: double
        builderFeeCharged:
          type: boolean
          description: Enabled and approved. Drives the `effective` block.
    RewardsFees:
      type: object
      required:
      - tier
      - cashbackPct
      - invitedRebatePct
      - invitedRebateActive
      properties:
        tier:
          type: string
          description: Loyalty tier name, from rolling 30-day Quote volume.
        cashbackPct:
          type: number
          format: double
        invitedRebatePct:
          type: number
          format: double
        invitedRebateActive:
          type: boolean
    EffectiveFees:
      type: object
      required:
      - perpBuilderBps
      - spotBuilderBps
      - perpRebateBps
      - spotRebateBps
      properties:
        perpTakerBps:
          type: number
          format: double
          nullable: true
        perpMakerBps:
          type: number
          format: double
          nullable: true
        spotTakerBps:
          type: number
          format: double
          nullable: true
          description: Spot **sell** rate. Hyperliquid collects builder fees in the quote asset, which
            a spot buy never yields, so a spot buy costs the Hyperliquid rate alone.
        spotMakerBps:
          type: number
          format: double
          nullable: true
          description: Spot **sell** rate. See `spotTakerBps`.
        perpBuilderBps:
          type: number
          format: double
          description: Builder bps added to the perp rates (0 when not charged).
        spotBuilderBps:
          type: number
          format: double
          description: Builder bps added to the spot rates (0 when not charged). Paid on a spot sell only.
        perpRebateBps:
          type: number
          format: double
          description: Rebate subtracted from the perp rates.
        spotRebateBps:
          type: number
          format: double
    CoinFunding:
      type: object
      required:
      - coin
      - net
      - paid
      - received
      - count
      properties:
        coin:
          type: string
        net:
          type: number
          format: double
          description: Net funding for this coin (received − paid); signed.
        paid:
          type: number
          format: double
          description: Funding paid for this coin, positive magnitude.
        received:
          type: number
          format: double
          description: Funding received for this coin, positive magnitude.
        count:
          type: integer
          format: int64
    FundingSummary:
      type: object
      required:
      - totalPaid
      - totalReceived
      - net
      - paymentCount
      - byCoin
      properties:
        totalPaid:
          type: number
          format: double
          description: Total funding paid in range, positive magnitude.
        totalReceived:
          type: number
          format: double
          description: Total funding received in range, positive magnitude.
        net:
          type: number
          format: double
          description: Net funding (received − paid); signed.
        paymentCount:
          type: integer
          format: int64
        byCoin:
          type: array
          items:
            $ref: '#/components/schemas/CoinFunding'
          description: Per-coin breakdown, largest absolute net first.
    FundingTimelinePoint:
      type: object
      required:
      - timestamp
      - net
      - paid
      - received
      properties:
        timestamp:
          type: integer
          format: int64
          description: Bucket start, epoch milliseconds.
        net:
          type: number
          format: double
          description: Cumulative net funding (received − paid); signed.
        paid:
          type: number
          format: double
          description: Cumulative funding paid, positive magnitude.
        received:
          type: number
          format: double
          description: Cumulative funding received, positive magnitude.
    FundingHistoryItem:
      type: object
      required:
      - timestamp
      - coin
      - usdc
      - szi
      - fundingRate
      properties:
        timestamp:
          type: integer
          format: int64
          description: Funding event time, epoch milliseconds.
        coin:
          type: string
        usdc:
          type: number
          format: double
          description: Signed USDC delta (HL convention; + received, − paid).
        szi:
          type: number
          format: double
          description: Signed position size at funding time.
        fundingRate:
          type: number
          format: double
    EquityPoint:
      type: object
      required:
      - timestamp
      - netFlow
      properties:
        timestamp:
          type: integer
          format: int64
          description: Sample time, epoch ms.
        accountValue:
          type: number
          format: double
          nullable: true
          description: Total perp + spot + lend; null = gap.
        perpEquity:
          type: number
          format: double
          nullable: true
        spotEquity:
          type: number
          format: double
          nullable: true
        unrealizedPnl:
          type: number
          format: double
          nullable: true
        netFlow:
          type: number
          format: double
          description: External net flow this hour (+ in / − out).
    AccountWallet:
      type: object
      properties:
        walletAddress:
          type: string
          description: Lowercase 0x address.
        isPrimary:
          type: boolean
          description: |
            The account's canonical wallet. Exactly one per account, and the
            address anything stored per-person rather than per-wallet lives at.
        label:
          type: string
          nullable: true
          description: |
            What the user named this wallet. `null` is ordinary: the primary is
            never named at creation and a label is optional on the rest, so a
            client renders a positional fallback ("Wallet 2") rather than an
            empty row.
      required:
      - walletAddress
      - isPrimary
    HealthResponse:
      type: object
      required:
      - status
      - version
      - network
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
        network:
          type: string
          enum:
          - mainnet
          - testnet
    ServiceCheck:
      type: object
      required:
      - service
      - status
      - latency_ms
      description: Field keys are snake_case.
      properties:
        service:
          type: string
        status:
          type: string
          enum:
          - ok
          - error
        message:
          type: string
        latency_ms:
          type: integer
          format: int64
    ReadinessResponse:
      type: object
      required:
      - status
      - checks
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
        checks:
          type: array
          items:
            $ref: '#/components/schemas/ServiceCheck'
    InfoResponse:
      type: object
      required:
      - network
      - api_url
      description: Field keys are snake_case.
      properties:
        network:
          type: string
          enum:
          - mainnet
          - testnet
        api_url:
          type: string
