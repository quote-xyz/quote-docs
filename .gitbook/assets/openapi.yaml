  /api/companies/{ticker}/summary:
    get:
      tags:
      - Companies
      summary: Get identity, valuation and next report for one underlying
      description: |
        The same stored snapshot `getCompany` serves, carrying only `profile`,
        `metrics` and `calendar`: who the company is, what it is worth, and
        when it next reports. The statements, insider decisions, filings and
        headlines are omitted; measured on NVDA they are 98% of that response.

        For a surface that renders about a dozen numbers and switches market
        often, on the trade page's About panel, and it is cheaper at the database
        too, not only on the wire: the excluded payload bodies are never read.

        A **separate path** rather than a parameter on `getCompany`, because the
        response shape differs. Nulling the heavy fields on the shared shape
        would make "not requested" and "the vendor has nothing" the same value,
        and the second is what `covered: false` already means.

        Payloads are the vendor's own response bodies, stored raw and
        uninterpreted, exactly as on `getCompany`. `covered: false` and `404`
        mean what they mean there.

        **Auth:** none. Registered in the public read-only group and per-IP
        rate limited.
      operationId: getCompanySummary
      parameters:
      - name: ticker
        in: path
        required: true
        description: Bare exchange ticker, e.g. `NVDA`.
        schema:
          type: string
          pattern: ^[A-Z][A-Z0-9.]{0,9}$
      responses:
        '200':
          description: The newest stored snapshot, summarised.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanySummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No snapshot for this ticker. The sweep has not reached it.
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/crypto/{symbol}/tokenomics:
    get:
      tags:
      - Crypto
      summary: Get supply, valuation and prose for the asset behind a crypto market
      description: |
        Returns the stored CoinGecko snapshot for the coin a market is about.
        Served from storage: no vendor call on the request path, which is what
        makes it safe to leave unauthenticated and cacheable.

        **`relation` says whose numbers these are, and it is not decoration.** A
        Hyperliquid perp is a contract that TRACKS an asset, so `BTC` returns
        Bitcoin's supply and market cap under `relation: underlying`: a
        perpetual has no circulating supply of its own. A spot pair IS the
        asset, so `PURR/USDC` returns `relation: asset`. Render the block from
        this field rather than from a market type: heading a perp's figures
        "Asset" asserts a quantity that does not exist.

        Symbols are resolved through a **curated** mapping (`assets.coingecko_id`),
        never by ticker. A ticker is not unique on CoinGecko: 14 coins are
        called ETH, and market-cap rank is not a resolution rule: it picks
        MEMETOON over the real Memecoin, and the answer looks exactly as
        confident as a correct one. So a symbol no human has mapped is a `404`,
        which includes every equity, commodity and prediction market.

        A perp and a spot pair on the same asset resolve to ONE stored row and
        cannot drift apart.

        Every figure is optional. `maxSupply` is absent where the protocol sets
        no cap, which is a fact about the token rather than a gap. Render the
        absence, not a zero. `marketFetchedAt` dates the valuation figures and
        is the only staleness signal here: a coin the vendor has stopped
        returning keeps its last values and stops at the date they were true.

        **Auth:** none. Registered in the public read-only group and per-IP
        rate limited.
      operationId: getTokenomics
      parameters:
      - name: symbol
        in: path
        required: true
        description: 'A Quote market symbol, venue prefix and all: `BTC`, `PURR/USDC`, `xyz:NVDA`. At
          most 64 characters.'
        schema:
          type: string
          maxLength: 64
          example: BTC
      responses:
        '200':
          description: The stored snapshot for this market's coin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenomicsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No CoinGecko mapping for this symbol.
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
