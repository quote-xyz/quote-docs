  /api/fees/summary:
    get:
      tags:
      - Analytics
      summary: Fee stack
      description: |
        The complete fee stack behind one trade for the calling wallet: the
        Hyperliquid leg (net taker/maker rates for perps and spot, plus the
        volume tier, HYPE-staking discount, and HL referral discount that
        produced them), Quote's builder fee and whether this wallet has
        approved it, the loyalty tier's cashback and referral rates, and the
        all-in effective rate.

        Rates are quoted in **basis points** (1 bp = 0.01%).

        `effective = hyperliquid + builder fee − the rewards rebate on that
        fee`. The rebate accrues as claimable USDC rather than an on-chain
        discount, so a fill still costs `hyperliquid + builder` at the moment
        it happens.

        `volumeTier` is derived from the wallet's actual rate, not from
        `volume14dUsd`: Hyperliquid tiers on 14-day volume weighted
        `perps + 2× spot`, and the daily rows don't split spot from perp, so
        `volume14dUsd` reads low for a wallet with spot volume. A `null`
        `volumeTier` means the rate didn't match the published ladder. Treat
        it as unknown, not as tier 0.

        Only the Hyperliquid leg is load-bearing. An unconfigured rewards
        program leaves `rewards` `null`, and a builder-fee approval that
        can't be read resolves toward `builderFeeCharged: true`, so an
        unreadable answer overstates the cost rather than understating it.

        **Auth:** API-key scope: `orders:read`.
      operationId: feeSummary
      responses:
        '200':
          description: The wallet's fee stack.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeeSummaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
