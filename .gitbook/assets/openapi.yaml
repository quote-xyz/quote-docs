          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/routing/savings:
    get:
      tags:
      - Routing
      summary: What connecting each venue would have been worth
      description: |
        For every child order Quote sends, a routing verdict is recorded against
        every venue that could have taken it, and nothing is acted on: the
        order goes where it always went. This endpoint reads those records back
        for the caller's own wallet and answers, per venue, what routing there
        would have cost or saved.

        The saving is split into two halves that want different work, because
        across the market/size cells measured offline the large majority came
        out fee-driven rather than liquidity-driven:

        - `feeSavingUsd`: the difference in trading fees. This is the half a
          venue connection captures on its own.
        - `executionSavingUsd`: the difference in what the book itself cost to
          cross. This is the half that needs a router.

        They sum to `savingUsd` net of any fragmentation premium charged for
        opening a second position leg (`premiumCostUsd`), which is why a venue
        can be cheaper to trade on and still not be a saving.

        A venue that could never be priced is still reported, with `refusals`
        naming which gate stopped it: a venue with no live book and a venue
        with no fee schedule both produce "nothing better was found" and mean
        different things.

        `caveat` states what these numbers are: displayed liquidity at a
        haircut, with no queue position, no latency, no market impact and no
        adverse selection. An upper bound on the opportunity, not a forecast of
        the fill.

        **Auth:** API-key scope: `account:read`.
      operationId: getRoutingSavings
      parameters:
      - name: days
        in: query
        required: false
        description: Look-back window in days. Clamped to 1-365.
        schema:
          type: integer
          default: 30
          minimum: 1
          maximum: 365
      responses:
        '200':
          description: Per-venue counterfactual savings for the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutingSavingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/routing/venues:
    get:
      tags:
      - Routing
      summary: Which venues you allow routing to
      description: |
        Every venue this build can route to, with the caller's preference for
        each. A venue the caller has never set is `enabled: true` with a null
        `updatedAt`: enabled is the default, and there is no stored row until
        someone changes it.

        Exactly one row carries `baseline: true`. That is where orders go when
        routing changes nothing, so it has no switch and
        `PUT /api/routing/venues/{venue}` refuses it.

        **Auth:** API-key scope: `account:read`.
      operationId: getRoutingVenues
      responses:
        '200':
          description: One entry per venue.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoutingVenuePref'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/routing/venues/{venue}:
    put:
      tags:
      - Routing
      summary: Turn one venue on or off
      description: |
        Set whether routing may consider this venue for the caller's orders.

        The preference applies to the recorded counterfactual as well, so a
        venue turned off appears in `GET /api/routing/savings` refused as
        `disabled` rather than silently vanishing: you can still see what the
        setting is costing.

        **Auth:** API-key scope: `account:write`.
      operationId: setRoutingVenue
      parameters:
      - name: venue
        in: path
        required: true
        description: Venue id, as returned by `GET /api/routing/venues`.
        schema:
          type: string
          enum:
          - kraken
          - coinbase
          - okx
          - lighter
          - binance
          - bybit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - enabled
              properties:
                enabled:
                  type: boolean
                  description: Whether routing may consider this venue.
      responses:
        '200':
          description: Preference stored.
          content:
            application/json:
              schema:
                type: object
                required:
                - venue
                - enabled
                properties:
                  venue:
                    type: string
                  enabled:
                    type: boolean
        '400':
          description: Unknown venue, or the baseline venue, which cannot be turned off.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
