openapi: 3.0.3
info:
  title: Quote API
  version: 0.1.0
  description: |-
    Hand-authored reference for the Quote Hyperliquid trading backend (Rust/axum).

    ## Wallet-scoped model
    Every authenticated request is resolved to a single normalized
    `wallet_address` by the auth layer. TiKV signing-key IDs, agent rows,
    template ownership, strategy ownership, invites, referrals, and analytics
    are all keyed by that wallet. Handlers never read `walletAddress` from
    request bodies or query strings. The caller identity always comes from the
    credential, never from the payload.

    ## Authentication
    Authenticate with an **HMAC API key** (`ApiKeyHmac`); see that security
    scheme for the canonical signing string. Keys are minted, listed, and
    revoked in the Quote terminal (**Settings → API Keys**); the secret is
    shown once at mint time. A key carries only the scopes granted at mint
    time and must satisfy the per-endpoint scope noted in each operation's
    description.

    Routes under `/api/*` require authentication, except the public
    `/api/info`. The root probes `/health`, `/ready`, and `/metrics` are
    unauthenticated.

    ## Async-accept order model
    `POST /api/orders` returns `200` when the order (or algo strategy) is
    **accepted into the execution engine**, NOT when it is filled. For algo
    strategies the response carries the parent order id; fills and progress
    arrive asynchronously (queryable via `GET /api/orders/algo*` or the
    `/ws/algos` WebSocket). Parent cancel success likewise means the cancel was
    durably accepted and child orders will be reconciled before a terminal
    state is recorded. It does not by itself mean the strategy is terminated.

    ## Order constraints (Hyperliquid)
    - **Minimum order notional ~$10**: Hyperliquid rejects orders below ~$10
      notional; sub-minimum child slices are skipped by strategies.
    - **Builder fee (approval required to trade)**: every order routed through
      Quote carries Quote's builder code, and Quote requires the approval
      before it will trade for a wallet. Approval is a one-time
      `approveBuilderFee` signature from the master wallet (performed in the
      terminal; verify via `builderFeeApproved` on `GET /api/agents`). The
      builder address must be lowercase hex; the fee field is in tenths of a
      basis point (2 bps = 20). Attachment is handled server-side.
    - **Price/size precision**: size is rounded to the asset's `szDecimals`;
      price is limited to 5 significant figures and `MAX_DECIMALS - szDecimals`
      decimal places.

    ## Error envelope
    All `4xx`/`5xx` responses (except `413` and `204`) use the JSON shape
    `{ "success": false, "error": "<message>" }`.
servers:
- url: https://api.quotemarkets.xyz
  description: Production
tags:
- name: Orders
  description: Order submission, cancellation, modification, and algo-order status.
- name: Agents
  description: Agent wallet lifecycle (create, register, builder-fee approval, terms).
- name: Positions
  description: Leverage, margin, and spot/perp transfer actions.
- name: Templates
  description: Saved order templates (CRUD).
- name: Triggers
  description: Conditional triggers (CRUD + history).
- name: Quests
  description: Tiered new-user quest progress and the favorite-quote submission.
- name: Analytics
  description: Execution-quality, volume, and fee analytics.
- name: Routing
  description: 'Counterfactual multi-venue routing: what each venue would have been worth, and which venues
    you allow.'
- name: Funding
  description: 'Funding-payment tracking: totals, timeline, and history.'
- name: Portfolio
  description: Quote-owned hourly equity time-series.
- name: Crypto
  description: Supply, valuation and prose for the asset behind a crypto market.
- name: Health
  description: Liveness/readiness probes, info, and Prometheus metrics.
security:
- ApiKeyHmac: []
paths:
  /.well-known/oauth-protected-resource/mcp:
    get:
      tags:
      - MCP Connector
      summary: OAuth Protected Resource Metadata, resource-suffixed (RFC 9728)
      description: Identical to the bare path. Both exist because a client may derive this URL from the
        `/mcp` resource rather than using the well-known root.
      operationId: oauthProtectedResourceMetadataForMcp
      security: []
      responses:
        '200':
          description: Resource + authorization-server metadata
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/orders:
    post:
      tags:
      - Orders
      summary: Submit an order or algo strategy
      description: |
        Submit a plain order (limit/market) or an algo strategy order.

        **Auth:** API-key scope:
        `orders:write`.

        **Async-accept:** a `200` means the order/strategy was **accepted into
        the engine**, not that it filled. For algo strategies (`strategy` set),
        `orderId` is the parent strategy id; track progress via
        `GET /api/orders/algo`.

        Sub-$10-notional orders are rejected by Hyperliquid; orders routed
        through Quote carry Quote's builder fee automatically.

        **Prerequisites:** a registered agent wallet AND builder-fee approval
        on the caller's wallet. Quote requires the approval before it will
        trade for a wallet; submissions without it fail. Check
        `builderFeeApproved` via `GET /api/agents` before trading.
      operationId: submitOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitOrderRequest'
      responses:
        '200':
          description: Order accepted into the engine (not necessarily filled).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitOrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/orders/cancel:
    post:
      tags:
      - Orders
      summary: Cancel a single order
      description: |
        Cancel a resting order or request cancellation of an algo strategy.

        **Auth:** API-key scope: `orders:write`.

        For a strategy parent, the response indicates only that the cancel was
        *requested*. Venue child orders are reconciled before a terminal state
        is recorded.
      operationId: cancelOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
      responses:
        '200':
          description: Cancel succeeded or was durably requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelOrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/orders/cancel-all:
    post:
      tags:
      - Orders
      summary: Cancel all open orders
      description: |
        Cancel all of the caller's open orders, optionally filtered by symbol.

        **Auth:** API-key scope: `orders:write`.
      operationId: cancelAllOrders
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelAllOrdersRequest'
      responses:
        '200':
          description: Returns the number of orders cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelOrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/orders/cancel-batch:
    post:
      tags:
      - Orders
      summary: Cancel a specific list of resting orders
      description: |
        Cancel exactly the listed resting orders in one signed venue action.

        **Auth:** API-key scope: `orders:write`.

        Every requested order gets a verdict in `results`, and the three counts
        partition that list. An order that was already closed when the cancel
        arrived is reported as `alreadyClosed`, not `cancelled`: it is not a
        failure, but it is not something this call did either.

        Resting orders only. A strategy parent is refused per-order with
        `failed`; cancel those through `/api/orders/cancel`.
      operationId: cancelOrdersBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrdersBatchRequest'
      responses:
        '200':
          description: Per-order verdicts. A partial failure is still a 200.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelOrdersBatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/account/mode:
    post:
      tags:
      - Positions
      summary: Set the account margin mode
      description: |
        Switch the Hyperliquid account between standard, unified and
        portfolio-margin mode.

        **Auth:** API-key scope: `positions:write`.
      operationId: setAccountMode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAccountModeRequest'
      responses:
        '200':
          description: Mode applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetAccountModeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/orders/simulate:
    post:
      tags:
      - Orders
      summary: Estimate what an order would cost
      description: |
        Pre-trade cost estimate: sweep the live L2 book for `size` on the
        requested side. Read-only, places nothing.

        A book that cannot price the order is reported in the body, not as an
        HTTP error.

        **Auth:** API-key scope: `orders:read`.
      operationId: simulateOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateOrderRequest'
      responses:
        '200':
          description: 'The estimate, or `hasEstimate: false` when the book cannot price it.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulateOrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/orders/urgency-preview:
    get:
      tags:
      - Orders
      summary: Preview the parameters an urgency setting implies
      description: |
        What a strategy would run with at a given urgency, before submitting
        anything. Pure computation: it reads no account and no market.

        **Auth:** authenticated. No scope required.
      operationId: urgencyPreview
      parameters:
      - name: strategy
        in: query
        required: true
        schema:
          type: string
        description: Strategy name, e.g. `twap`, `vwap`, `participation_rate`.
      - name: urgency
        in: query
        required: false
        schema:
          type: number
          format: double
        description: Urgency position 0-100. Required for `twap` and `vwap`.
      - name: participationPct
        in: query
        required: false
        schema:
          type: number
          format: double
        description: Target participation 0-100, for `participation_rate`.
      responses:
        '200':
          description: The implied parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UrgencyPreviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/orders/algo/{order_id}/fills:
    get:
      tags:
      - Orders
      summary: List an algo order's child fills
      description: |
        Every fill recorded against one algo order's child orders, oldest
        first. Capped to the newest 5000: a run that outgrows the cap loses
        its oldest fills from the list, never its newest.

        **Auth:** API-key scope: `orders:read`.
      operationId: getAlgoOrderFills
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
        description: The algo parent order id.
      responses:
        '200':
          description: The order's fills, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlgoOrderFillsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/orders/algo/{order_id}/diagnostics:
    get:
      tags:
      - Orders
      summary: Replay an algo order's diagnostics
      description: |
        The persisted diagnostic timeline for one algo order, oldest first.
        Each entry's `details` is exactly the redacted `wake`-frame payload
        the `/api/ws/algos` socket streams live, the same projection, so
        replayed and live entries can be merged into one timeline.
        Best-effort research data: a row may be missing under load.

        **Auth:** API-key scope: `orders:read`.
      operationId: getAlgoOrderDiagnostics
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
        description: The algo parent order id.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 1000
          maximum: 5000
        description: Maximum entries returned. When a run has more, the NEWEST entries are kept (then
          returned oldest-first).
      responses:
        '200':
          description: The order's diagnostics, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlgoDiagnosticsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/orders/algo/{order_id}/speed-up:
    post:
      tags:
      - Orders
      summary: Speed up a running algo order
      description: |
        Compress a running algo order's remaining schedule. The engine applies
        the change to the live strategy; it does not resubmit the order.

        **Once per order.** A second speed-up on the same parent is rejected
        with `400`, whoever made the first one. `GET /api/orders/algo` reports
        `alreadySpedUp`, which is how to tell before calling.

        **Auth:** API-key scope: `orders:write`.
      operationId: speedUpOrder
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
        description: The algo parent order id.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeedUpOrderRequest'
      responses:
        '200':
          description: The applied change, or `success` false with an `error`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeedUpOrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/positions/tpsl:
    post:
      tags:
      - Positions
      summary: Attach take-profit and stop-loss to a position
      description: |
        Place TP/SL triggers against an open position. Existing position-bound
        triggers on the same symbol are replaced, plus any fixed-size triggers
        named in `replaceOids`.

        **Auth:** API-key scope: `orders:write`.
      operationId: setPositionTpsl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPositionTpslRequest'
      responses:
        '200':
          description: The triggers placed, with any warnings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetPositionTpslResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/trade-intents:
    get:
      tags:
      - Analytics
      summary: List trade intents
      description: |
        The caller's recent trade intents, newest first.

        A trade intent is the meta-order above strategy runs: it records what
        was being attempted and when the decision was made, and one or more
        strategy runs execute as its tactics. Orders submitted with an
        `envelope` create one.

        **Auth:** API-key scope: `orders:read`.
      operationId: listTradeIntents
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int64
        description: Page size. Defaults to 50.
      responses:
        '200':
          description: The caller's intents.
          content:
            application/json:
              schema:
                type: object
                required:
                - intents
                properties:
                  intents:
                    type: array
                    items:
                      type: object
                      description: 'A trade intent: its id, symbol, side, total size, the validated objective
                        and mandate, the arrival anchor captured at creation, and its fill accounting.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/trade-intents/{id}:
    get:
      tags:
      - Analytics
      summary: Cross-tactic execution report for one intent
      description: |
        How one decision actually executed, across every strategy run that
        served it.

        **Auth:** API-key scope: `orders:read`.
      operationId: getTradeIntentReport
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The intent's execution report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentExecutionReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/markets/book-depth:
    get:
      tags:
      - Analytics
      summary: One market's own book depth
      description: |
        How much is resting inside 1% of the mid on Hyperliquid, both sides
        reported separately. This is the asset page's order-book block, and it
        is a different question from `depth-compare`: one venue asked how much
        is there, rather than several ranked against each other.

        **Read `coversWindow` before rendering the totals**. See the field.
        A symbol with no readable book answers 404 rather than zeroes: zero
        depth and an unreadable book render identically and mean opposite
        things.

        **Auth:** none.
      operationId: getBookDepth
      parameters:
      - name: symbol
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Depth inside the window for the symbol.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDepth'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No readable book for this symbol.
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/orders/modify:
    post:
      tags:
      - Orders
      summary: Modify an existing order
      description: |
        Update the price and/or size of an existing order via Hyperliquid's
        modify action.

        **Auth:** API-key scope: `orders:write`.
      operationId: modifyOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModifyOrderRequest'
      responses:
        '200':
          description: Order modified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModifyOrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/orders/algo:
    get:
      tags:
      - Orders
      summary: List algo (strategy) orders
      description: |
        List the caller's algo/strategy orders from the Postgres read
        projection.

        **Auth:** API-key scope: `orders:read`.
      operationId: getAlgoOrders
      responses:
        '200':
          description: List of algo orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlgoOrdersResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/orders/algo/{order_id}:
    get:
      tags:
      - Orders
      summary: Get a single algo order
      description: |
        Fetch a single algo/strategy order by parent order id. Must belong to
        the caller's wallet.

        **Auth:** API-key scope: `orders:read`.
      operationId: getAlgoOrder
      parameters:
      - name: order_id
        in: path
        required: true
        description: Parent strategy order id.
        schema:
          type: string
      responses:
        '200':
          description: The algo order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlgoOrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/orders/by-client-id/{client_order_id}:
    get:
      tags:
      - Orders
      summary: Resolve an order by its client order id
      description: |
        Answer what happened to the order you submitted under a given
        `clientOrderId`. This is the endpoint to call when a submit timed out or
        returned `VENUE_UNREACHABLE` and you need to know whether the order
        landed before deciding to re-send.

        Two sources are consulted and the response says which answered:

        - Quote's own order registry, which knows the venue order id and the
          fills recorded against it.
        - Hyperliquid, keyed by the same client order id, which is authoritative
          about the order's current lifecycle and covers the case where our reply
          was lost before we learned the order id.

        `found: false` means neither source can account for the id: nothing was
        placed, and re-sending under the same id is safe. That is a `200`, not a
        `404`. It is an answer to the question, and a `404` would be
        indistinguishable from a mistyped path.

        A field is absent when no source could supply it, never zero. In
        particular `filledSize` absent means "unknown", which is not the same
        claim as `"0"`, and `venueStatus` absent means Hyperliquid could not be
        reached, which is distinct from `venueStatus: unknownOid`, which is Hyperliquid
        saying it has no such order.

        Not charged against the order-submission rate budget, so it stays
        available to a client that has just been rate limited.

        **Auth:** API-key scope: `orders:read`.
      operationId: getOrderByClientId
      parameters:
      - name: client_order_id
        in: path
        required: true
        description: The client order id the order was submitted under.
        schema:
          type: string
      responses:
        '200':
          description: What is known about the order, including that nothing is.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderByClientIdResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
