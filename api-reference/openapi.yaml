  /api/funding/history:
    get:
      tags:
      - Funding
      summary: Funding history
      description: |
        Detailed per-event funding log over a time range, newest-first.

        **Auth:** API-key scope: `orders:read`.
      operationId: fundingHistory
      parameters:
      - $ref: '#/components/parameters/AnalyticsRange'
