      type: object
      required:
      - success
      - replaced
      properties:
        success:
          type: boolean
        tpOrderId:
          type: string
          nullable: true
        slOrderId:
          type: string
          nullable: true
        replaced:
          type: integer
          description: How many previous position-bound triggers were cancelled.
        warnings:
          type: array
          items:
            type: string
          description: Non-fatal problems, e.g. the new legs are live but a replaced trigger could not
            be cancelled.
        error:
          type: string
          nullable: true
