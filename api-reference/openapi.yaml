                  $ref: '#/components/schemas/FundingHistoryItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/portfolio/equity:
    get:
      tags:
      - Portfolio
      summary: Equity time-series
      description: |
        Hourly account-value samples (perp + spot), with margin, unrealized PnL,
        and per-hour net flow. `accountValue` may be `null` (a gap), never 0.
        PnL view = Δ accountValue − Σ netFlow.

        **Auth:** API-key scope: `orders:read`.
      operationId: portfolioEquity
      parameters:
      - $ref: '#/components/parameters/AnalyticsRange'
      responses:
        '200':
          description: Equity samples, oldest-first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EquityPoint'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/portfolio/equity/latest:
    get:
      tags:
      - Portfolio
      summary: Latest equity sample
      description: |
        The most recent equity sample for the wallet (or `null`).

        **Auth:** API-key scope: `orders:read`.
      operationId: portfolioEquityLatest
      responses:
        '200':
          description: Latest sample or null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquityPoint'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
