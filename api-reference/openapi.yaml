  /api/info:
    get:
      tags:
      - Health
      summary: API/network info
      description: |
        Small network/config debug endpoint reporting the active network and
        Hyperliquid API URL.

        **Auth:** public (no auth).
      operationId: getInfo
      security: []
      responses:
        '200':
          description: Network info.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /health:
    get:
      tags:
      - Health
      summary: Liveness probe
      description: Always returns 200 while the process is running.
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: Liveness OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      tags:
      - Health
      summary: Readiness probe
      description: |
        Returns 200 if all configured dependencies (PostgreSQL, Hyperliquid
        circuit breakers, TiKV vault, JetStream) are healthy; 503 otherwise.
      operationId: readinessCheck
      security: []
      responses:
        '200':
          description: All dependencies healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: One or more dependencies degraded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /metrics:
    get:
      tags:
      - Health
      summary: Prometheus metrics
      description: |
        Prometheus text-format metrics in local/default mode. In OTLP mode this
        returns `503` because metrics flow through the OpenTelemetry collector.
      operationId: metrics
      security: []
      responses:
        '200':
          description: Prometheus text exposition format.
          content:
            text/plain:
              schema:
                type: string
        '503':
          description: Metrics disabled (OTLP mode).
components:
  securitySchemes:
    ApiKeyHmac:
      type: apiKey
      in: header
      name: X-Quote-Key
      description: |
        HMAC API-key authentication. Three headers are sent on every request:

        - `X-Quote-Key`: the public key id (this scheme's header).
        - `X-Quote-Timestamp`: request time in **milliseconds** since epoch.
          Must be within 30 seconds of server time.
        - `X-Quote-Signature`: hex HMAC-SHA256 over the canonical string.

        **Canonical signing string** (literal `\n` separators):

        ```
        <timestamp>\n<METHOD>\n<path_with_query>\n<body>
        ```

        where `<timestamp>` is the `X-Quote-Timestamp` value, `<METHOD>` is the
        uppercase HTTP method, `<path_with_query>` is the request path including
        any query string, and `<body>` is the raw request body (empty string if
        none). The 32-byte secret returned at mint time is used **directly** as
        the HMAC-SHA256 key.

        Keys are minted, listed, and revoked in the Quote terminal
        (**Settings → API Keys**). A key carries only the scopes granted at mint
        time.
  parameters:
    TemplateId:
      name: template_id
      in: path
      required: true
      description: Template UUID.
      schema:
        type: string
        format: uuid
    TriggerId:
      name: trigger_id
      in: path
      required: true
      description: Trigger UUID.
      schema:
        type: string
        format: uuid
    AnalyticsRange:
      name: range
      in: query
      required: false
      description: 'Time range. One of: 1d, 7d, 30d, all. Defaults to a server default when omitted.'
      schema:
        type: string
        enum:
        - 1d
        - 7d
        - 30d
        - all
  responses:
    BadRequest:
      description: Invalid request (validation error, malformed body/UUID, etc.).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 'Authenticated but not permitted: the API key lacks the required scope.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found or not owned by the caller's wallet.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadGateway:
      description: Upstream (Hyperliquid/Relay) returned an error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: |
        A required dependency is unavailable or a feature is not configured
        (also returned when a Hyperliquid circuit breaker is open).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: |
        Request body exceeds the 4 MiB limit enforced by the body-buffering
        layer. The response body is not the standard JSON error envelope.
  schemas:
    ErrorResponse:
      type: object
      description: Standard error envelope used for 4xx/5xx (except 413/204).
      required:
      - success
      - error
      properties:
        success:
          type: boolean
          enum:
          - false
        error:
          type: string
        code:
          type: string
          description: |
            Stable machine-readable error code, present only on errors a client
            is expected to branch on (currently `HL_NOT_FUNDED` on 422 from
            `POST /api/agents/register`).
    SuccessResponse:
      type: object
      required:
      - success
      properties:
        success:
          type: boolean
          enum:
          - true
    MessageResponse:
      type: object
      description: Generic success response with an optional human-readable message.
      required:
      - success
      properties:
        success:
          type: boolean
        message:
          type: string
        error:
          type: string
    Side:
      type: string
      enum:
      - buy
      - sell
    OrderType:
      type: string
      enum:
      - limit
      - market
    TimeInForce:
      type: string
      description: Time in force. Serialized as the uppercase variant names.
      enum:
      - GTC
      - ALO
      - IOC
    TpslMode:
      type: string
      enum:
      - market
      - limit
    TpslSide:
      type: object
      required:
      - triggerPrice
      properties:
        triggerPrice:
          type: string
        limitPrice:
          type: string
          nullable: true
    TpslParams:
      type: object
      description: TP/SL configuration. Note `mode`, `tp`, `sl` are snake/lower as named.
      required:
      - mode
      properties:
        mode:
          $ref: '#/components/schemas/TpslMode'
        tp:
          allOf:
          - $ref: '#/components/schemas/TpslSide'
          nullable: true
        sl:
          allOf:
          - $ref: '#/components/schemas/TpslSide'
          nullable: true
    StrategyParamsInput:
      type: object
      description: |
        Strategy-specific parameters forwarded to the execution engine. The
        relevant subset depends on the chosen `strategy`; a knob a strategy does
        not read is simply not applied.

        **Unknown keys are rejected with a 400** listing them. A misspelled or
        misplaced knob used to be accepted and ignored, which reported as
        success and executed as though you had never set it. Keys accept either
        camelCase or snake_case (`durationSecs` == `duration_secs`), and
        decimal/"bps" fields accept a string, integer or float.

        TP/SL is **not** set here: use the top-level `tpsl` field.
      additionalProperties: false
      properties:
        reduceOnly:
          type: boolean
          nullable: true
          description: Per-strategy override of the top-level `reduceOnly`. See that field for what reduce-only
            means.
        timeInForce:
          type: string
          nullable: true
          description: Child-order TIF (gtc/alo/ioc), strategy-dependent.
        durationSecs:
          type: integer
          format: int64
          nullable: true
          description: Total wall-clock window the schedule spans, in seconds. Time-sliced strategies
            (`passive_twap` and `vwap`) only.
        numSlices:
          type: integer
          format: int64
          nullable: true
          description: How many child orders the schedule is split into. Derived from `urgency` when omitted.
        passivePct:
          type: integer
          format: int64
          nullable: true
          description: Share of each slice's window spent resting passively before crossing, 0–100. Derived
            from `urgency` when omitted.
        clipSize:
          type: string
          nullable: true
          description: 'Iceberg: visible clip size, base-asset decimal as string.'
        clipPct:
          type: number
          format: double
          nullable: true
        participationRate:
          type: string
          nullable: true
          description: '`participation_rate` only: the share of market volume to execute at, as a decimal
            fraction string ("0.1" = 10%). Enforced as a cap, not a target.'
        urgency:
          type: integer
          format: int64
          nullable: true
          description: 'How aggressive the schedule is, 0–100. **Not a duration**: it does not say how
            long the order takes; `durationSecs` does. It is a dial the engine expands into the mechanical
            knobs: a higher value means fewer, faster slices that cross sooner (slice count falls from
            20 toward 3, passive share from 95% toward 40%), and on `vwap` a higher participation rate
            (5% toward 50%). `GET /api/orders/urgency-preview` returns the exact values a given position
            derives, so you can see what a number will do before sending it.'
        randomize:
          type: boolean
          nullable: true
          description: Jitter slice timing and size instead of running a deterministic schedule.
        maxSlippageBps:
          type: string
          nullable: true
          description: 'Price bound in basis points from the arrival mid, beyond which the order will
            not execute. On `participation_rate` it bounds every child order including the `maxDurationSecs`
            completion sweep, and taker clips that would breach it are skipped rather than sent; the order
            may finish unfilled. On the arrival-price strategy it sets the guaranteed-completion sweep
            tolerance. Other strategies ignore it: use `limitPrice` there. Must be greater than 0.'
        hardCancelPct:
          type: string
          nullable: true
        offsetFromMidBps:
          type: integer
          format: int64
          nullable: true
        chaseEnabled:
          type: boolean
          nullable: true
        guaranteedCompletion:
          type: boolean
          nullable: true
    SubmitOrderRequest:
      type: object
      required:
      - symbol
      - side
      - size
      - orderType
      properties:
        symbol:
          type: string
          example: ETH
        side:
          $ref: '#/components/schemas/Side'
        size:
          type: string
          description: Base-asset size as a decimal string.
        orderType:
          $ref: '#/components/schemas/OrderType'
        limitPrice:
          type: string
          nullable: true
          description: Required for limit orders; for market orders supply a slippage-adjusted price.
        reduceOnly:
          type: boolean
          nullable: true
          default: false
          description: 'Only let this order shrink an existing position, never open or flip one. The venue
            caps the fill at the position size and rejects it outright if the position has closed in the
            meantime, which is what makes it the safe way to close: a duplicate or stale close cannot
            accidentally open the opposite side. Combine it with `strategy` to close a position with an
            algo. Cannot be combined with `tpsl` on an algo: a closing order builds no position to protect.'
        timeInForce:
          allOf:
          - $ref: '#/components/schemas/TimeInForce'
          nullable: true
        clientOrderId:
          type: string
          nullable: true
        strategy:
          type: string
          nullable: true
          description: Algo strategy name (e.g. passive_twap, vwap, iceberg, participation_rate, chase_limit).
            Omit for a plain order.
        params:
          allOf:
          - $ref: '#/components/schemas/StrategyParamsInput'
          nullable: true
        tpsl:
          allOf:
          - $ref: '#/components/schemas/TpslParams'
          nullable: true
          description: |-
            Take-profit / stop-loss for this order. **The only place TP/SL is set**: there is no per-strategy equivalent.
            How it is applied depends on the strategy, because the mechanics differ. A plain order is one venue order, so the bracket is attached to it and is live as soon as it rests. An algo is many child orders, and a bracket per child would mean one per clip, each orphaned as its siblings filled. So for an algo the legs are placed **once, on the resulting position, when the run reaches a terminal state** (sized to the position, including a partial fill from a cancelled or expired run).
            The consequence worth knowing: for an algo the legs do not exist while the order is still working, so a price that crosses your trigger mid-run triggers nothing. If you need protection during execution, set a `limitPrice`, or use `params.maxSlippageBps` on the strategies that read it.
        source:
          type: string
          nullable: true
          description: Originating product surface, when not the plain order form (e.g. `quentin` for
            orders dispatched by the NL assistant). Attribution only, never affects execution.
    SubmitOrderResponse:
      type: object
      required:
      - success
      properties:
        success:
          type: boolean
        orderId:
          type: string
          description: Venue order id, or for algo strategies the parent strategy id.
        status:
          type: string
        provider:
          type: string
          description: Execution provider, e.g. "hyperliquid".
        error:
          type: string
        warnings:
          type: array
          items:
            type: string
    CancelOrderRequest:
      type: object
      required:
      - symbol
      - orderId
      properties:
        symbol:
          type: string
        orderId:
          type: string
    CancelOrderResponse:
      type: object
      required:
      - success
      properties:
        success:
          type: boolean
        message:
          type: string
        error:
          type: string
    CancelAllOrdersRequest:
      type: object
      properties:
        symbol:
          type: string
          nullable: true
          description: If omitted, cancels all open orders.
    ModifyOrderRequest:
      type: object
      required:
      - symbol
      - orderId
      - side
      - limitPrice
      - size
      properties:
        symbol:
          type: string
        orderId:
          type: integer
          format: int64
          description: Exchange order id to modify.
        side:
          type: string
          enum:
          - buy
          - sell
        limitPrice:
          type: string
        size:
          type: string
        reduceOnly:
          type: boolean
          default: false
        timeInForce:
          type: string
          enum:
          - gtc
          - alo
          - ioc
          nullable: true
          description: Defaults to gtc.
        clientOrderId:
          type: string
          nullable: true
    ModifyOrderResponse:
      type: object
      required:
      - success
      properties:
        success:
          type: boolean
        message:
          type: string
        error:
          type: string
    AlgoOrderInfo:
      type: object
      required:
      - orderId
      - symbol
      - side
      - orderQty
      - filledQty
      - status
      - strategy
      - submitTime
      properties:
        orderId:
          type: string
        symbol:
          type: string
        side:
          type: string
          description: Debug-formatted side (e.g. "Buy"/"Sell").
        orderQty:
          type: string
        filledQty:
          type: string
        status:
          type: string
        strategy:
          type: string
        submitTime:
          type: string
          format: date-time
        error:
          type: string
          description: Why the order failed. Present only for failed orders.
    AlgoOrdersResponse:
      type: object
      required:
      - success
      - orders
      properties:
        success:
          type: boolean
        orders:
          type: array
          items:
            $ref: '#/components/schemas/AlgoOrderInfo'
    AlgoOrderResponse:
      type: object
      required:
      - success
      - order
      properties:
        success:
          type: boolean
        order:
          $ref: '#/components/schemas/AlgoOrderInfo'
    StrategyInfo:
      type: object
      required:
      - name
      - aliases
      - basic
      - description
      - params
      properties:
        name:
          type: string
          description: Canonical name to send as `strategy` on POST /api/orders.
          example: passive_twap
        aliases:
          type: array
          items:
            type: string
          description: Other accepted spellings that resolve to this strategy.
        basic:
          type: boolean
          description: True when the strategy resolves to a single venue order rather than an algo that
            slices its own children.
        description:
          type: string
        params:
          type: array
          items:
            type: string
          description: '`params` keys this strategy reads.'
    StrategiesResponse:
      type: object
      required:
      - strategies
      properties:
        strategies:
          type: array
          items:
            $ref: '#/components/schemas/StrategyInfo'
    AlgoFillInfo:
      type: object
      required:
      - symbol
      - side
      - size
      - price
      - timestamp
      properties:
        symbol:
          type: string
        side:
          type: string
        size:
          type: string
          description: Base-asset quantity, decimal as string.
        price:
          type: string
          description: Decimal as string.
        fee:
          type: string
          nullable: true
          description: Exchange fee in USDC.
        builderFee:
          type: string
          nullable: true
          description: Builder fee in USDC.
        isMaker:
          type: boolean
          nullable: true
          description: Whether this fill added liquidity.
        timestamp:
          type: integer
          format: int64
          description: Fill time, epoch milliseconds.
    AlgoOrderFillsResponse:
      type: object
      required:
      - success
      - fills
      properties:
        success:
          type: boolean
        fills:
          type: array
          items:
            $ref: '#/components/schemas/AlgoFillInfo'
    SpeedUpOrderRequest:
      type: object
      properties:
        factor:
          type: number
          format: double
          nullable: true
          default: 2.0
          description: How much to compress the remaining schedule. 2.0 runs the remainder in half the
            time it would otherwise take.
    SpeedUpOrderResponse:
      type: object
      required:
      - success
      properties:
        success:
          type: boolean
        message:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
        factor:
          type: number
          format: double
          nullable: true
          description: The compression factor actually applied.
        newDurationSecs:
          type: integer
          format: int64
          nullable: true
          description: New total duration measured from order start, for time-sliced strategies.
        newParticipationRate:
          type: string
          nullable: true
          description: New participation rate (`participation_rate` only), decimal as string.
    CancelOrderItem:
      type: object
      required:
      - symbol
      - orderId
      properties:
        symbol:
          type: string
        orderId:
          type: string
          description: Exchange order id.
    CancelOrdersBatchRequest:
      type: object
      required:
      - orders
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/CancelOrderItem'
    CancelOrderResult:
      type: object
      required:
      - symbol
      - orderId
      - success
      properties:
        symbol:
          type: string
        orderId:
          type: string
        success:
          type: boolean
        error:
          type: string
          nullable: true
        orderStatus:
          type: string
          nullable: true
          description: Venue lifecycle status when the order was already closed at cancel time (e.g. `filled`,
            `canceled`). Absent on a plain cancel.
    CancelOrdersBatchResponse:
      type: object
      required:
      - success
      - cancelled
      - failed
      - results
      properties:
        success:
          type: boolean
          description: True only when every requested order is no longer open.
        cancelled:
          type: integer
        failed:
          type: integer
          description: Genuine venue rejections. An already-closed order is not one.
        results:
          type: array
          items:
            $ref: '#/components/schemas/CancelOrderResult'
    SimulateOrderRequest:
      type: object
      required:
      - symbol
      - side
      - size
      properties:
        symbol:
          type: string
          example: ETH
        side:
          type: string
          description: '`buy` or `sell` (case-insensitive).'
        size:
          type: string
          description: Base-asset size, decimal as string.
    SimulateOrderResponse:
      type: object
      required:
      - success
      properties:
        success:
          type: boolean
        expectedPrice:
          type: string
          nullable: true
          description: Average fill price for the swept portion.
        vwap:
          type: string
          nullable: true
          description: Volume-weighted average price of the same sweep (mirrors `expectedPrice`).
        impactBps:
          type: string
          nullable: true
          description: Signed depth cost against `bestPrice`, in basis points. Positive = worse for the
            side.
        bestPrice:
          type: string
          nullable: true
          description: 'Best opposing quote at sweep time (best ask for buys, best bid for sells): the
            reference `impactBps` was measured against, so you can derive the dollar slippage from the
            same reference.'
        mid:
          type: string
          nullable: true
          description: Mid price from the same snapshot, informational.
        availableSize:
          type: string
          nullable: true
          description: Total resting size on the swept side of the book.
        error:
          type: string
          nullable: true
