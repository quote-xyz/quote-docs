          type: string
          nullable: true
        error:
          type: string
          nullable: true
    TacticSummary:
      type: object
      required:
      - filled
      properties:
        parentOrderId:
          type: string
          format: uuid
          nullable: true
        strategy:
          type: string
          nullable: true
        filled:
          type: string
          description: Decimal as string.
        execVwap:
          type: string
          nullable: true
        vsTacticArrivalBps:
          type: string
          nullable: true
          description: This tactic's shortfall against **its own** arrival, the execution component only.
            Not comparable across tactics of one intent.
        vsMarketOrderBps:
          type: string
          nullable: true
        makerFillPct:
          type: string
          nullable: true
    IntentExecutionReport:
      type: object
      required:
      - intentId
      - symbol
      - side
      - objective
      - totalSize
      - filledSize
      - residual
      - tacticCount
      - totalFees
      - builderFees
      - elapsedSecs
      - tactics
      properties:
        intentId:
          type: string
          format: uuid
        symbol:
          type: string
        side:
          $ref: '#/components/schemas/Side'
        objective:
          type: string
          enum:
          - arrival
          - vwap
          - close
          - none
          description: The benchmark the intent asked to be measured against. `arrival` is the default
            (shortfall against the mid at intent creation); `none` means the caller explicitly did not
            want one.
        totalSize:
          type: string
        filledSize:
          type: string
        residual:
          type: string
          description: Size still unexecuted across every tactic.
        tacticCount:
          type: integer
        execVwap:
          type: string
          nullable: true
          description: Size-weighted execution price across every tactic.
        arrivalMid:
          type: string
          nullable: true
          description: The intent's arrival anchor, captured once at creation and never back-filled.
        totalShortfallBps:
          type: string
          nullable: true
          description: 'Total implementation shortfall against the intent''s arrival: delay + execution.
            Positive = worse.'
        executionBps:
          type: string
          nullable: true
          description: 'The execution component: size-weighted tactic shortfall against each tactic''s
            own arrival.'
        delayBps:
          type: string
          nullable: true
          description: 'The delay component, `total − execution`: what the price did between committing
            to the intent and a tactic working it. Positive = the market moved against you while waiting.'
        vsMarketOrderBps:
          type: string
          nullable: true
          description: vs a simulated per-slice market order, size-weighted.
        vsHlNativeTwapBps:
          type: string
          nullable: true
          description: vs an estimate of Hyperliquid's native TWAP, crediting the taker fee the maker
            share avoided.
        makerFillPct:
          type: string
          nullable: true
        totalFees:
          type: string
        builderFees:
          type: string
        elapsedSecs:
          type: integer
          format: int64
        tactics:
          type: array
          items:
            $ref: '#/components/schemas/TacticSummary'
