      type: object
      required:
      - id
      - progress
      - target
      properties:
        id:
          type: string
          description: 'Quest identifier from the closed catalog: `fund_account`, `first_trade`, `connect_x`,
            `join_telegram`, `first_algo_order`, `quentin_trades`, `tpsl_set`, `conditional_order`, `all_strategies`,
            `algo_position_exit`, `trigger_variety`, `algo_speedup`, `trade_spot`, `trade_builder_dex`,
            `trade_prediction`, `market_variety`, `saved_vs_market`, `maker_fill`, `funding_collected`,
            `trade_days`, `api_key_minted`, `mcp_connected`, `cli_order`, `invite_friends`, `submit_quote`,
            `claim_rewards`. Read the ids rather than hard-coding a list: quests are added and retired
            as the product changes.'
        progress:
          type: number
          format: double
          description: Progress toward `target`, capped at `target`.
        target:
          type: number
          format: double
        tier:
          type: integer
          description: Catalog tier. An internal grouping key retained for analytics; not a user-facing
            progression axis (badges are). Unrelated to the volume-based loyalty tiers on `/api/referrals/summary`.
        completedAt:
          type: string
          format: date-time
          description: Present once the quest is complete (sticky).
    BadgeStatus:
      type: object
      required:
      - key
      - quests
      - earned
      - completed
      - total
      - isNew
      properties:
        key:
          type: string
          enum:
          - setup
          - operator
          - strategist
          - cartographer
          - editor
          - typesetter
          - advocate
          description: Stable badge identifier. Badges partition the quest catalog into thematic sets,
            independently of `QuestStatus.tier`.
        quests:
          type: array
          description: Member quest ids, in display order.
          items:
            type: string
        earned:
          type: boolean
          description: True once every member quest is complete.
        earnedAt:
          type: string
          format: date-time
          description: 'Present once earned: the completion time of the last member quest, not the time
            the award was first observed.'
        completed:
          type: integer
        total:
          type: integer
        isNew:
          type: boolean
          description: Earned but not yet acknowledged via `POST /api/quests/badges/{key}/seen`. Fire
            an unlock celebration on this flag, then acknowledge so it does not replay.
    QuestsResponse:
      type: object
      required:
      - success
