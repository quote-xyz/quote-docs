    post:
      tags:
      - Positions
      summary: Set TP/SL on an open position
      description: |
        Place take-profit / stop-loss triggers bound to an open position.

        This is how you protect a position you already hold, including one an
        algo built, if you did not set `tpsl` on the order itself. The legs are
        reduce-only and sized to the current position (or to `size`, if you want
        to protect only part of it).

        **Replaces, does not append.** The request expresses the full desired
        state: any existing position-bound triggers for the symbol are cancelled
        once the new legs are accepted. Placement happens before cleanup, so a
        failure can never leave the position with no protection at all. The
        trade-off is that a failed cleanup leaves old triggers resting, reported
        in `warnings`.

        At least one of `tpsl.tp` / `tpsl.sl` is required. To clear protection
        entirely, cancel the trigger orders via `/api/orders/cancel`.

        **Auth:** API-key scope: `orders:write`.
      operationId: setPositionTpsl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPositionTpslRequest'
      responses:
        '200':
