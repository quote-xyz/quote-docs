          type: integer
          nullable: true
          description: Slice count the schedule will use (`twap`).
        passivePct:
          type: integer
          nullable: true
          description: Passive share of each slice window, 0–100 (`twap`).
        participationPct:
          type: integer
          nullable: true
          description: Participation rate the schedule will target, 0–100 (`vwap`).
        expectedMakerPct:
          type: integer
          nullable: true
          description: Expected share of fills that rest as maker, 0–100.
    SetPositionTpslRequest:
      type: object
      required:
      - symbol
      - tpsl
      properties:
        symbol:
          type: string
          description: Symbol with an open position.
          example: BTC
        tpsl:
          $ref: '#/components/schemas/TpslParams'
        size:
          type: string
          nullable: true
          description: Base-asset size the trigger legs should cover. Omit to cover the whole position.
            The legs are fixed-size either way (they do not resize as the position changes), so a partial
            size is a deliberate "protect this much" choice, not a ratio that tracks the position. A value
            larger than the current position is refused rather than clamped.
