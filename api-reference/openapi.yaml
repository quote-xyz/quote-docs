  /api/trade-intents/{id}:
    get:
      tags:
      - Analytics
      summary: Get a trade intent's execution report
      description: |
        The cross-tactic execution report for one intent.

        This measures the whole meta-order rather than a single strategy run,
        which matters when more than one tactic worked the same intent: each run
        captures its own arrival price, so per-run benchmarks are not comparable
        across them.

        Shortfall is reported in Perold's decomposition and the parts are kept
        separate on purpose. `totalShortfallBps` is measured from the intent's
        arrival anchor (captured once, when the decision was made),
        `executionBps` from each tactic's own arrival, and `delayBps` is the
        residue between them: what the market did while nothing was working the
        order. Folding delay into execution would let "waited for a better
        price" read as good execution.

        All bps follow the house convention: **positive = worse.**

        **Auth:** API-key scope: `orders:read`.
      operationId: getTradeIntentReport
      parameters:
      - name: id
        in: path
        required: true
        description: Trade intent id (UUID).
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The execution report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentExecutionReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
